name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, Typecheck, Test & Build
    # CI_RUNNER is a JSON label array that overrides the self-hosted default, for example ["ubuntu-latest"] for a public repo.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy script test
        run: bash scripts/tests/test-deploy.sh

      - name: Build
        run: npm run build
